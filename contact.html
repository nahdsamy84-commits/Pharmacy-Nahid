<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تواصل معنا - صيدلية عافية</title>

<style>
body {
    font-family: Arial, sans-serif;
    background-color: #f2f7f5;
    color: #222;
    margin: 0;
    padding: 0;
    transition: 0.3s;
}

header {
    background-color: #087f5b;
    color: white;
    text-align: center;
    padding: 20px;
}

nav {
    background-color: #066747;
    padding: 12px;
    text-align: center;
}

nav a {
    color: white;
    text-decoration: none;
    margin: 10px;
}

.container {
    background: white;
    width: 85%;
    max-width: 500px;
    margin: 30px auto;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 2px 8px #ccc;
}

input, textarea {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border: 1px solid #ccc;
    border-radius: 5px;
    box-sizing: border-box;
}

button {
    background: #087f5b;
    color: white;
    border: none;
    padding: 12px 20px;
    margin: 5px;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background: #055c41;
}

body.dark {
    background: #222;
    color: white;
}

body.dark .container {
    background: #333;
    color: white;
}

body.dark input,
body.dark textarea {
    background: #444;
    color: white;
    border-color: #777;
}
</style>
</head>

<body>

<header>
    <h1>صيدلية عافية</h1>
    <p>نسعد بتواصلكم معنا</p>
</header>

<nav>
    <a href="index.html">الرئيسية</a>
    <a href="medicine.html">الأدوية</a>
    <a href="service.html">الخدمات</a>
    <a href="contact.html">تواصل معنا</a>
</nav>

<div class="container">
    <h2>تواصل معنا</h2>

    <button type="button" onclick="changeMode()">الوضع الليلي / النهاري</button>

    <form id="contactForm">
        <label>الاسم:</label>
        <input type="text" id="name" placeholder="اكتب اسمك" required>

        <label>البريد الإلكتروني:</label>
        <input type="email" id="email" placeholder="اكتب بريدك الإلكتروني" required>

        <label>رقم الهاتف:</label>
        <input type="tel" id="phone" placeholder="اكتب رقم هاتفك" required>

        <label>الرسالة:</label>
        <textarea id="message" rows="5" placeholder="اكتب رسالتك هنا" required></textarea>

        <button type="submit">إرسال الرسالة</button>
        <button type="reset">مسح البيانات</button>
    </form>

    <p id="result"></p>
</div>

<script>
function changeMode() {
    document.body.classList.toggle("dark");
}

document.getElementById("contactForm").addEventListener("submit", function(event) {
    event.preventDefault();

    let name = document.getElementById("name").value;

    document.getElementById("result").innerHTML =
        "شكراً يا " + name + "، تم استلام رسالتك بنجاح.";

    this.reset();
});
</script>

</body>
</html>
